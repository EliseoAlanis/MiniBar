<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MiniBar - Inventario</title>
    <link rel="stylesheet" href="../css/InventarioStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .modal {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--glow);
            width: 400px;
            max-width: 90%;
        }

        .modal h3 {
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .modal form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal input, .modal select {
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: var(--mid-gray);
            color: var(--text-color);
        }

        .modal .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal .modal-actions button {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-cancel {
            background-color: #555;
            color: #fff;
        }

        .btn-save {
            background-color: var(--accent-color);
            color: var(--black);
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo"><h1>Mini<span>Bar</span></h1></div>
        <nav class="main-menu">
            <ul>
                <li><a href="#"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li class="active"><a href="#"><i class="fas fa-wine-glass-alt"></i> Inventario</a></li>
                <li><a href="#"><i class="fas fa-cocktail"></i> Cócteles</a></li>
                <li><a href="#"><i class="fas fa-receipt"></i> Ventas</a></li>
                <li><a href="#"><i class="fas fa-users"></i> Clientes</a></li>
                <li><a href="#"><i class="fas fa-cog"></i> Configuración</a></li>
            </ul>
        </nav>
        <div class="user-profile">
            <div class="avatar"><img src="/api/placeholder/40/40" alt="Usuario"></div>
            <div class="user-info"><h3>Administrador</h3><p>Premium</p></div>
        </div>
    </aside>

    <!-- Contenido principal -->
    <main class="main-content">
        <header class="top-bar">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Buscar en inventario...">
            </div>
            <div class="top-menu">
                <button class="notification-btn"><i class="fas fa-bell"></i><span class="badge">3</span></button>
                <button class="help-btn"><i class="fas fa-question-circle"></i></button>
            </div>
        </header>

        <div class="page-title">
            <h2>Inventario</h2>
            <p class="date">Jueves, 15 de Mayo 2025</p>
        </div>

        <section class="inventory-section">
            <div class="section-header">
                <h3>Gestión de Productos</h3>
                <button class="add-btn" onclick="openModal()">➕ Agregar Producto</button>
            </div>

            <table class="inventory-table" id="inventoryTable">
                <thead>
                <tr>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Stock</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <!-- Productos agregados dinámicamente -->
                </tbody>
            </table>
        </section>
    </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h3 id="modalTitle">Agregar Producto</h3>
        <form id="productForm">
            <input type="text" id="nombre" placeholder="Nombre del producto" required>
            <input type="number" id="stock" placeholder="Cantidad en stock" required>
            <select id="categoria" required>
                <option value="">Seleccionar categoría</option>
                <option value="Destilado">Destilado</option>
                <option value="Cerveza">Cerveza</option>
                <option value="Refresco">Refresco</option>
            </select>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-save">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script>
    const modal = document.getElementById('modalOverlay');
    const form = document.getElementById('productForm');
    const table = document.getElementById('inventoryTable').querySelector('tbody');
    let editRow = null;

    function openModal(editing = false, row = null) {
        modal.style.display = 'flex';
        if (editing && row) {
            document.getElementById('modalTitle').textContent = 'Editar Producto';
            document.getElementById('nombre').value = row.cells[0].textContent;
            document.getElementById('categoria').value = row.cells[1].textContent;
            document.getElementById('stock').value = parseInt(row.cells[2].textContent);
            editRow = row;
        } else {
            form.reset();
            editRow = null;
            document.getElementById('modalTitle').textContent = 'Agregar Producto';
        }
    }

    function closeModal() {
        modal.style.display = 'none';
        form.reset();
        editRow = null;
    }

    function calcularEstado(cantidad) {
        if (cantidad >= 4) return { texto: 'Disponible', clase: 'ok' };
        if (cantidad >= 2) return { texto: 'Bajo', clase: 'low' };
        return { texto: 'Crítico', clase: 'critical' };
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        const nombre = document.getElementById('nombre').value;
        const categoria = document.getElementById('categoria').value;
        const stock = parseInt(document.getElementById('stock').value);
        const estado = calcularEstado(stock);

        if (editRow) {
            editRow.cells[0].textContent = nombre;
            editRow.cells[1].textContent = categoria;
            editRow.cells[2].textContent = stock + ' botellas';
            editRow.cells[3].innerHTML = `<span class="status ${estado.clase}">${estado.texto}</span>`;
        } else {
            const row = table.insertRow();
            row.innerHTML = `
        <td>${nombre}</td>
        <td>${categoria}</td>
        <td>${stock} botellas</td>
        <td><span class="status ${estado.clase}">${estado.texto}</span></td>
        <td>
          <button class="action-btn edit" onclick="openModal(true, this.parentNode.parentNode)"><i class="fas fa-edit"></i></button>
          <button class="action-btn delete" onclick="this.parentNode.parentNode.remove()"><i class="fas fa-trash"></i></button>
        </td>
      `;
        }
        closeModal();
    });
</script>
</body>
</html>
