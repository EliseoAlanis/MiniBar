<!DOCTYPE html>
<html lang="es">
<link rel="stylesheet" href="../css/Usuario.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniBar - Perfil de Usuario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo">
            <h1>Mini<span>Bar</span></h1>
        </div>
        <nav class="main-menu">
            <ul>
                <li><a href="Usuario.html" class="active"><i class="fas fa-users"></i> Usuario</a></li>
                <li><a href="/Electronica/client/src/html/Cocteles.html"><i class="fa-solid fa-martini-glass"></i> Cócteles</a></li>
                <li><a href="TragosPersonalizados.html"><i class="fas fa-blender"></i> Tragos Personalizados</a></li>
                <li><a href="Banco.html"><i class="fas fa-university"></i> Banco</a></li>
                <li><a href="#"><i class="fas fa-cog"></i> Configuración</a></li>
            </ul>
        </nav>
        <div class="user-profile">
            <div class="avatar">
                <img src="/api/placeholder/40/40" alt="Usuario">
            </div>
            <div class="user-info">
                <h3>Cliente</h3>
                <p>Premium</p>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="profile-container">
            <header class="profile-header">
                <h1 class="profile-title">Perfil de Usuario</h1>
            </header>

            <div class="profile-form">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <div class="input-wrapper">
                        <input type="text" id="nombre" value="Juan Carlos Pérez" readonly>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" value="juan.perez@email.com" readonly>
                    </div>
                </div>

                <div class="form-group">
                    <label for="dni">DNI</label>
                    <div class="input-wrapper">
                        <input type="text" id="dni" value="12.345.678" readonly>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" value="••••••••••" readonly>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn-primary" onclick="toggleEditForm()">
                        <i class="fas fa-edit"></i>
                        Editar Perfil
                    </button>
                    <button class="btn-secondary" onclick="togglePasswordForm()">
                        <i class="fas fa-key"></i>
                        Cambiar Contraseña
                    </button>
                </div>

                <!-- Formulario de edición de perfil -->
                <div id="edit-form" class="form-container" style="display: none;">
                    <h3>Editar Perfil</h3>
                    <input type="text" placeholder="Nuevo nombre">
                    <input type="email" placeholder="Nuevo correo electrónico">
                    <input type="text" placeholder="Nuevo DNI">
                    <button class="btn-primary">Guardar Cambios</button>
                </div>

                <!-- Formulario para cambiar contraseña -->
                <div id="password-form" class="form-container" style="display: none;">
                    <h3>Cambiar Contraseña</h3>
                    <input type="password" placeholder="Contraseña actual">
                    <input type="password" placeholder="Nueva contraseña">
                    <input type="password" placeholder="Confirmar nueva contraseña">
                    <button class="btn-secondary">Actualizar Contraseña</button>
                </div>

            </div>
        </div>
    </main>
</div>
<!-- Reemplazá tu <script> actual por este completo -->
<script>
    function toggleEditForm() {
        const form = document.getElementById('edit-form');
        form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }

    function togglePasswordForm() {
        const form = document.getElementById('password-form');
        form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }

    // GUARDAR CAMBIOS DE PERFIL
    document.querySelector('#edit-form .btn-primary').addEventListener('click', () => {
        const nuevoNombre = document.getElementById('nuevo-nombre').value;
        const nuevoEmail = document.getElementById('nuevo-email').value;
        const nuevoDNI = document.getElementById('nuevo-dni').value;

        // Actualiza los campos visibles
        document.getElementById('nombre').value = nuevoNombre;
        document.getElementById('email').value = nuevoEmail;
        document.getElementById('dni').value = nuevoDNI;

        // Guarda en localStorage
        localStorage.setItem('nombre', nuevoNombre);
        localStorage.setItem('email', nuevoEmail);
        localStorage.setItem('dni', nuevoDNI);

        alert('Perfil actualizado correctamente');
        toggleEditForm();
    });

    // ACTUALIZAR CONTRASEÑA
    document.querySelector('#password-form .btn-secondary').addEventListener('click', () => {
        const actual = document.getElementById('pass-actual').value;
        const nueva = document.getElementById('pass-nueva').value;
        const confirmar = document.getElementById('pass-confirmar').value;

        const passGuardada = localStorage.getItem('password') || '';

        if (actual !== passGuardada) {
            alert('La contraseña actual es incorrecta');
            return;
        }

        if (nueva !== confirmar) {
            alert('Las nuevas contraseñas no coinciden');
            return;
        }

        localStorage.setItem('password', nueva);
        alert('Contraseña actualizada correctamente');
        togglePasswordForm();
    });

    // Cargar datos guardados al iniciar
    window.onload = () => {
        const nombre = localStorage.getItem('nombre');
        const email = localStorage.getItem('email');
        const dni = localStorage.getItem('dni');

        if (nombre) document.getElementById('nombre').value = nombre;
        if (email) document.getElementById('email').value = email;
        if (dni) document.getElementById('dni').value = dni;
    };
</script>
</body>
</html>
